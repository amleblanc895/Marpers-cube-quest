html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; }
body {
  font-family: 'Jersey 10', system-ui, sans-serif; color: var(--ink); font-size: 22px;
  background: linear-gradient(var(--sky1), var(--sky2) 60%, #b7e3a8 60%, #8fcf7e);
  user-select: none; -webkit-user-select: none;
}
.screen { position: absolute; inset: 0; display: none; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.screen.on { display: flex; animation: scrIn .22s ease-out; }
@keyframes scrIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#title.screen.on { animation: none; }
.overlay.on .panel { animation: pop .28s cubic-bezier(.2,1.5,.5,1); }
@keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.card { transition: transform .08s; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; border: 3px solid var(--purple); border-radius: 14px; padding: 6px 12px; margin: 8px 0; font-size: 24px; text-align: left; }
.setrow small { display: block; font-size: 17px; opacity: .7; }
.switch { width: 64px; height: 36px; border-radius: 999px; background: #d8d0e8; border: 3px solid var(--purple); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--purple); transition: left .15s; }
.switch.on { background: var(--good); }
.switch.on::after { left: 29px; }
.gear { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--cream); border: 3px solid var(--purple); box-shadow: 0 3px 0 var(--purple); font-size: 20px; line-height: 1; }
.cbkey { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 2px 0 6px; font-size: 18px; }
.cbkey span { display: inline-flex; align-items: center; gap: 3px; }
.cbkey canvas { width: 22px; height: 22px; }
button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
.px { font-family: 'Press Start 2P', monospace; }

/* Title */
#title { align-items: center; justify-content: center; background: linear-gradient(#0178fa 50%, #5d4d95 50%); cursor: pointer; }
#title img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
#title img.bg { object-fit: cover; filter: blur(14px) saturate(1.1) brightness(.85); transform: scale(1.15); }
#title { overflow: hidden; }
.menu-marper { display: flex; align-items: flex-end; gap: 8px; margin-top: auto; padding-top: 10px; }
.menu-marper canvas { height: 150px; aspect-ratio: 166/177; }
.menu-marper .bubble { margin-bottom: 40px; }
#title h1 { font-size: 64px; line-height: .9; margin: 0; color: #fff; text-shadow: 0 4px 0 var(--purple), 0 0 0 #000, 4px 4px 0 var(--ink); letter-spacing: 1px; }
#title .sub { font-size: 24px; color: #fff; text-shadow: 2px 2px 0 var(--ink); }
.blink { animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.note { font-size: 16px; color: var(--ink); opacity: .7; }

/* Menus */
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; min-height: 56px; }
.topbar h2 { margin: 0; flex: 1; font-size: 30px; color: #fff; text-shadow: 2px 2px 0 var(--ink); }
.mute { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--cream); border: 3px solid var(--purple); font-size: 20px; line-height: 1; box-shadow: 0 3px 0 var(--purple); }
.mute.muted { opacity: .5; }
.back { width: 44px; height: 44px; border-radius: 12px; background: var(--cream); border: 3px solid var(--purple); font-size: 26px; line-height: 1; box-shadow: 0 3px 0 var(--purple); }
.menu-body { flex: 1; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.card { background: #fff; border: 4px solid var(--purple); border-radius: 18px; padding: 16px; box-shadow: 0 5px 0 var(--purple); text-align: left; display: flex; align-items: center; gap: 14px; width: 100%; }
.card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--purple); }
.card .big { font-size: 34px; line-height: 1; }
.card .desc { font-size: 19px; opacity: .8; }
.card .desc .px { font-size: 10px !important; letter-spacing: 0; line-height: 1.6; }
.card .icon { width: 64px; height: 64px; flex: none; }
.card.locked { opacity: .55; box-shadow: 0 5px 0 #8c7fb0; border-color: #8c7fb0; }
.card .tag { margin-left: auto; font-size: 18px; white-space: nowrap; }
.section-h { color: #fff; text-shadow: 2px 2px 0 var(--ink); font-size: 26px; margin: 8px 2px -4px; }
.num { font-family: 'Press Start 2P', monospace; font-size: 18px; width: 44px; height: 44px; border-radius: 50%; background: var(--purple); color: #fff; display: grid; place-items: center; flex: none; }
.num.done { background: var(--good); }

/* Play */
#play .topbar { padding-bottom: 4px; }
#play .topbar h2 { font-size: 26px; }
.hud { display: flex; gap: 6px; align-items: center; }
.pill { background: var(--cream); border: 3px solid var(--purple); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.dots { display: flex; gap: 6px; }
.dots span { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--purple); }
.dots span.done { background: var(--good); }
.dots span.cur { background: var(--glow); }
.coach { display: flex; align-items: flex-end; gap: 8px; padding: 0 12px; min-height: 118px; }
#marper { height: 118px; width: auto; aspect-ratio: 166/177; flex: none; margin-bottom: -4px; }
.bubble { position: relative; flex: 1; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 12px; font-size: 22px; line-height: 1.05; min-height: 72px; margin-bottom: 12px; }
.bubble::before { content: ''; position: absolute; left: -14px; bottom: 14px; border: 8px solid transparent; border-right: 12px solid var(--ink); }
.bubble::after { content: ''; position: absolute; left: -8px; bottom: 16px; border: 6px solid transparent; border-right: 9px solid #fff; }
.bubble b { color: var(--purple); }
.bubble .px { font-size: 14px !important; white-space: nowrap; }
.stage { position: relative; flex: 1; min-height: 160px; margin: 0 10px; background: var(--cream); border: 4px solid var(--purple); border-radius: 20px; box-shadow: inset 0 0 0 3px #fff, 0 4px 0 rgba(43,29,74,.35); overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.side { position: absolute; bottom: 8px; width: 52px; height: 52px; border-radius: 14px; background: #fff; border: 3px solid var(--purple); box-shadow: 0 3px 0 var(--purple); display: grid; place-items: center; }
.side svg { width: 34px; height: 34px; }
#rotL { left: 8px; } #rotR { right: 8px; }
.side-top { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.chip { height: 40px; padding: 0 12px; border-radius: 12px; background: #fff; border: 3px solid var(--purple); box-shadow: 0 3px 0 var(--purple); font-size: 20px; }
.chip:disabled { opacity: .35; }
.peek { position: absolute; top: 10px; left: 12px; font-size: 16px; opacity: .55; pointer-events: none; }
.actions { display: flex; gap: 10px; justify-content: center; padding: 8px 10px 4px; min-height: 58px; }
.go { min-width: 120px; height: 48px; padding: 0 18px; border-radius: 14px; background: var(--good); color: #fff; font-size: 26px; border: 3px solid #1d7a3a; box-shadow: 0 4px 0 #1d7a3a; text-shadow: 1px 1px 0 #1d7a3a; }
.go.alt { background: #fff; color: var(--ink); border-color: var(--purple); box-shadow: 0 4px 0 var(--purple); text-shadow: none; }
.go:active, .chip:active, .side:active, .mv:active { transform: translateY(2px); }
.pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 6px 10px 12px; }
.mv { height: 58px; border-radius: 12px; background: #fff; border: 3px solid var(--purple); box-shadow: 0 3px 0 var(--purple); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; }
.mv svg { width: 26px; height: 22px; }
.mv .px { font-size: 13px; }
.mv.prime { background: #efe8ff; }
.mv:disabled { opacity: .4; }
.mv.glow, .side.glow { background: var(--glow); animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { to { box-shadow: 0 3px 0 var(--purple), 0 0 0 6px rgba(255,210,63,.55); } }
.pad.off .mv { opacity: .45; }

/* Overlay */
.overlay { position: absolute; inset: 0; background: rgba(43,29,74,.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
.overlay.on { display: flex; }
.panel { background: var(--cream); border: 4px solid var(--purple); border-radius: 20px; padding: 18px; width: min(360px, 100%); text-align: center; box-shadow: 0 6px 0 var(--purple); }
.panel h3 { margin: 0 0 6px; font-size: 40px; }
.panel .stars { font-size: 44px; letter-spacing: 6px; color: var(--glow); text-shadow: 2px 2px 0 var(--ink); margin: 4px 0; }
.panel .stars .dim { color: #d8d0e8; }
.panel .lines { font-size: 22px; margin: 8px 0 14px; }
.panel .row { display: flex; gap: 8px; justify-content: center; } .panel .go { min-width: 0; flex: 1; padding: 0 8px; font-size: 22px; }
.toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 44px; color: #fff; text-shadow: 3px 3px 0 var(--ink); pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.toast.on { opacity: 1; }
</style>
</head>

  function hYCross(cube, ctx) {

    const plan = { moves: A.ycross, say: 'Keep going with the <b>Yellow Builder</b>.' };
    if (p === '') return R(A.ycross[0], 'A yellow <b>dot</b>! Do the <b>Yellow Builder</b>: <span class="px">F R U R\' U\' F\'</span>', [], plan);

    if (p === 'BL') return R(A.ycross[0], 'An <b>L</b> pointing back-left. Do the <b>Yellow Builder</b>!', [], plan);

const STICKER = { Y: '#ffd500', W: '#ffffff', G: '#00a651', B: '#1f5fd1', O: '#ff7a00', R: '#d62a3a' };
const cv = $('#cv'), ctx = cv.getContext('2d');
const VIEW = { yaw: -0.62, pitch: 0.5 };
const peek = { yaw: 0, pitch: 0, drag: null };
function rotA(v, axis, a) {
  const c = Math.cos(a), s = Math.sin(a), [x, y, z] = v;
  if (axis === 0) return [x, y * c - z * s, y * s + z * c];
  if (axis === 1) return [x * c + z * s, y, -x * s + z * c];
  return [x * c - y * s, x * s + y * c, z];
}
const DIST = 10;
let W = 0, H = 0, DPR = 1, FOC = 1;
function resize() {
  const r = cv.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  FOC = Math.min(W, H) * 1.45;
}
window.addEventListener('resize', resize);
function camYaw() { return VIEW.yaw + peek.yaw; }
function camPitch() { return VIEW.pitch + peek.pitch; }
function toCam(v) { return rotA(rotA(v, 1, camYaw()), 0, camPitch()); }
function proj(c) { const k = FOC / (DIST - c[2]); return [W / 2 + c[0] * k, H * 0.5 - c[1] * k]; }
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const AXES = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function drawCube(now) {
  const cube = G.cube;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  // shadow
  ctx.fillStyle = 'rgba(91,58,155,.12)'; ctx.beginPath(); ctx.ellipse(W / 2, H * 0.5 + Math.min(W, H) * 0.36, Math.min(W, H) * 0.3, Math.min(W, H) * 0.06, 0, 0, 7); ctx.fill();
  let ang = 0, def = null;
  if (Anim.cur) {
    const a = Anim.cur; def = E.MOVE_DEFS[a.m.f];
    const k = Math.min(1, (now - a.t0) / a.dur);
    ang = easeIO(k) * (Math.PI / 2) * (a.m.t === 2 ? 2 : 1) * def.s * (a.m.t === -1 ? -1 : 1);
  }
  const eyeW = rotA(rotA([0, 0, DIST], 0, -camPitch()), 1, -camYaw());
  const items = cube.cubies.map(q => {
    const moving = def && E.inLayer(q, def);
    const tr = v => moving ? rotA(v, def.axis, ang) : v;
    const P = tr(q.p);
    const cp = toCam(P);
    const d = Math.hypot(cp[0], cp[1], cp[2] - DIST);
    return { q, moving, tr, P, d };
  });
  let first = items, second = [];
  if (def && def.layer !== null) {
    const camOnMovingSide = def.layer > 0 ? eyeW[def.axis] > 0.5 : eyeW[def.axis] < -0.5;
    const mov = items.filter(i => i.moving), rest = items.filter(i => !i.moving);
    if (camOnMovingSide) { first = rest; second = mov; } else { first = mov; second = rest; }
  }
  const pulse = 0.5 + 0.5 * Math.sin(now / 180);
  for (const grp of [first, second]) {
    grp.sort((a, b) => b.d - a.d);
    for (const it of grp) drawCubie(it, pulse);
  }
  // arrow
  const am = G.arrowMove;
  if (am && !(Anim.cur && Anim.cur.m.f !== am.f)) drawArrow(am, now);
}

function poly(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); }

const CB = { on: false };
const SYM = {

  B: [[-0.17, -0.17], [0.17, -0.17], [0.17, 0.17], [-0.17, 0.17]],
  O: [[0, 0.25], [0.22, 0], [0, -0.25], [-0.22, 0]],

// Arrow paths in cube coordinates (cube spans -1.5..1.5)
const S = 1.56;
function arcPts(cx, cy, r, a0, a1, z) { const pts = []; for (let i = 0; i <= 18; i++) { const a = a0 + (a1 - a0) * i / 18; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), z]); } return pts; }
const ARROWS = {
  R: [[1, -1.3, S], [1, 1.3, S]], L: [[-1, 1.3, S], [-1, -1.3, S]],
  U: [[1.3, 1, S], [-1.3, 1, S]], D: [[-1.3, -1, S], [1.3, -1, S]],
  F: arcPts(0, 0, 1.0, 2.6, -1.9, S),
  B: [[S, -1.3, -1], [S, 1.3, -1]],
  y: [[1.3, 0, S], [-1.3, 0, S]],
};
function arrowFor(m) {
  let p = ARROWS[m.f]; if (!p) return null;
  return m.t === -1 ? p.slice().reverse() : p;
}
function drawArrow(m, now) {
  const p3 = arrowFor(m); if (!p3) return;
  const pts = p3.map(p => proj(toCam(p)));
  const bob = 0.5 + 0.5 * Math.sin(now / 160);
  const sc = Math.min(W, H) / 330;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const head = () => {
    const a = pts[pts.length - 1], b = pts[pts.length - 2];
    const dx = a[0] - b[0], dy = a[1] - b[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const hs = 20 * sc;
    const tip = [a[0] + ux * hs * 0.6, a[1] + uy * hs * 0.6];
    return [tip, [a[0] - uy * hs * 0.75 - ux * hs * 0.3, a[1] + ux * hs * 0.75 - uy * hs * 0.3], [a[0] + uy * hs * 0.75 - ux * hs * 0.3, a[1] - ux * hs * 0.75 - uy * hs * 0.3]];
  };
  const line = () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); };
  ctx.globalAlpha = 0.75 + 0.25 * bob;
  line(); ctx.strokeStyle = '#2b1d4a'; ctx.lineWidth = 15 * sc; ctx.stroke();
  poly(head()); ctx.fillStyle = '#2b1d4a'; ctx.fill(); ctx.lineWidth = 6 * sc; ctx.strokeStyle = '#2b1d4a'; ctx.stroke();
  line(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 8 * sc; ctx.stroke();
  poly(head()); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------------- animation queue ---------------- */
const Anim = {
  q: [], cur: null,
  push(m, dur, done) { this.q.push({ m, dur, done }); if (!this.cur) this.next(); },
  next() {
    const it = this.q.shift(); if (!it) { this.cur = null; return; }
    it.t0 = performance.now(); it.dur = (it.dur || (it.m.t === 2 ? 300 : 210)) * SPEED;
    this.cur = it; Sfx.tick();
  },
  step(now) {
    const a = this.cur; if (!a) return;
    if (now - a.t0 >= a.dur) {
      E.applyMove(G.cube, a.m); this.cur = null;
      if (a.done) a.done();
      if (!this.cur) this.next();
    }
  },
  busy() { return !!this.cur || this.q.length > 0; },
  clear() { this.q = []; this.cur = null; },
};
const playMove = (m, dur) => new Promise(res => Anim.push(m, dur, res));

let lastFrame = 0;
function frame(now) {
  if (G.paused && Anim.cur) Anim.cur.t0 += now - lastFrame;
  lastFrame = now;
  if (!G.paused) Anim.step(now);
  if (!peek.drag && (peek.yaw || peek.pitch)) {
    peek.yaw *= 0.86; peek.pitch *= 0.86;
    if (Math.abs(peek.yaw) < .002) peek.yaw = 0; if (Math.abs(peek.pitch) < .002) peek.pitch = 0;
  }
  if ($('#play').classList.contains('on')) {
    if (!W) resize();
    drawCube(now);
    drawMarperNow(now);
    if (G.ctrl && G.ctrl.tick && !G.paused) G.ctrl.tick(now);
  }
  if ($('#menu').classList.contains('on')) drawSprite(menuMarperCv, 0, frameAt('idle', now));
  requestAnimationFrame(frame);
}

  const c = G.ctrl;

  const exp = c && c.expected ? c.expected() : null;
  if (exp && !same(m, exp)) { wrongTurn(m); return; }
  G.hintMove = null;
  Hints.track(G.hctx, m);
  if (c && c.onPress) c.onPress(m);

  refresh();
}

const LL_ALGS = ["F R U R' U' F'", "R U R' U R U2 R' U", "U R U' L' U R' U' L", 'U', "U'", 'U2'];
const pick = a => a[Math.floor(Math.random() * a.length)];
function messyTop(c, n = 7) { for (let i = 0; i < n; i++) E.applyAlg(c, pick(LL_ALGS)); return c; }
const SEXY = E.parseAlg("R U R' U'");
function cornerCase(j, r) {
  const c = messyTop(E.newCube());
  for (let i = 0; i < j; i++) E.applyAlg(c, SEXY);

  return c;
}
const YB = E.parseAlg("F R U R' U' F'");
function yellowEdgesUp(c) {
  const Y = [0, 1, 0], out = [];
  for (const [k, p] of Object.entries({ F: [0, 1, 1], B: [0, 1, -1], L: [-1, 1, 0], R: [1, 1, 0] })) {
    const q = c.cubies.find(q => E.eq(q.p, p)); const s = q.st.find(s => E.eq(s.n, Y)); if (s && s.c === 'Y') out.push(k);
  }
  return out.sort().join('');
}
// history tail matches a prefix of alg? returns k (0..len-1) moves done
function algProgress(alg) {
  const h = G.history;
  for (let k = Math.min(alg.length - 1, h.length); k >= 1; k--) {
    let ok = true;
    for (let i = 0; i < k; i++) if (!same(h[h.length - k + i], alg[i])) { ok = false; break; }
    if (ok) return k;
  }
  return 0;
}
function cycleProgress(cyc) {
  // how far into a repeating cycle (e.g. R U R' U' R U ...) the move history tail is; returns next index
  const h = G.history;
  for (let k = Math.min(h.length, 24); k >= 1; k--) {
    let ok = true;
    for (let i = 0; i < k; i++) if (!same(h[h.length - k + i], cyc[i % cyc.length])) { ok = false; break; }
    if (ok) return k % cyc.length;
  }
  return 0;
}

function greenFront(c) { for (let i = 0; i < 4 && E.centerColor(c, [0, 0, 1]) !== 'G'; i++) E.applyAlg(c, 'y'); return c; }
function makeStageCase(def) {
  for (let tries = 0; tries < 30; tries++) {
    const c = E.newCube(); E.applyAlg(c, E.randomScramble(25));
    if (def.prev && Hints.solveUntil(c, Hints.GOAL[def.prev]) < 0) continue;
    greenFront(c);
    if (Hints.GOAL[def.stage](c)) continue;
    const sim = E.cloneCube(c);
    if (tries < 25 && Hints.solveUntil(sim, Hints.GOAL[def.stage]) < 5) continue; // needs real work, not just a top turn
    return c;
  }
  return E.newCube();
}

  const done = Store.get('lessons', {}); done[num] = true; Store.set('lessons', done);
  const next = num + 1 < LESSON_DEFS.length ? { label: 'Next lesson', fn: () => startLesson(num + 1) } : { label: 'Lessons', fn: () => { leavePlay(); show('lessons'); } };
  results({ title: `Lesson ${num} done!`, stars: hints ? 2 : 3, lines: [LESSON_DEFS[num].title, hints ? `Hints used: ${hints}` : 'No hints. Wow!'], next });
}

const LessonBase = {
  start() { $('#playTitle').textContent = `Lesson ${this.num}`; this.learn(); },
  setStep(i) { this.step = i; hud(dots(4, i)); },
  learn() {
    this.setStep(0); G.inputOn = false; this.expected = null; actions([]);
    setCube(makeStageCase(this.def)); G.highlight = this.def.hl(G.cube); refresh();
    const pages = this.def.learn; let i = 0;
    const page = () => { say(pages[i]); actions([{ label: i < pages.length - 1 ? 'Next ▶' : 'Watch me! ▶', fn: () => { if (++i < pages.length) page(); else this.watch(); } }]); };
    page();
  },
  async watch() {
    this.setStep(1); G.inputOn = false; this.expected = null; actions([]);
    setCube(makeStageCase(this.def)); G.highlight = this.def.hl(G.cube); refresh();
    const sid = G.session, st = this.def.stage, p0 = Hints.progress(st, G.cube);
    Music.set('watch'); say('Watch me! Follow the <b>arrows</b>.'); await wait(1300);
    let moves = 0;
    while (sid === G.session) {
      if (Hints.GOAL[st](G.cube)) break;
      if (this.def.watchUnit === 'unit' && moves >= 3 && !G.hctx.plan && Hints.progress(st, G.cube) > p0) break;
      if (moves > 120) break;
      const h = Hints.hint(G.cube, G.hctx); if (!h) break;
      if (h.target.length) G.highlight = new Set(h.target);
      G.watchMove = h.m; say(`${h.say}<br>${moveLine(h.m)}`); refresh();
      await wait(moves === 0 ? 1100 : 520); if (sid !== G.session) return;
      await playMove(h.m, 460); if (sid !== G.session) return;
      Hints.track(G.hctx, h.m); moves++;
    }
    if (sid !== G.session) return;
    G.watchMove = null; Music.set('play'); refresh();
    Sfx.done(); setPose('cheer'); toast('Ta-da!');
    const all = Hints.GOAL[st](G.cube);
    say(all ? `That's how it's done! ${this.def.done}` : 'See? Then you <b>repeat</b> that for the other pieces!');
    actions([{ label: '↺ Again', alt: true, fn: () => this.watch() }, { label: 'Your turn ▶', fn: () => this.tryIt() }]);
  },
  tryIt() {
    this.setStep(2); actions([]); Music.set('play');
    setCube(makeStageCase(this.def)); G.highlight = this.def.hl(G.cube);
    this.p0 = Hints.progress(this.def.stage, G.cube); this.moves = 0; this._exp = null;
    this.expected = () => { if (!this._exp) { if (Anim.busy()) return null; this._exp = Hints.hint(G.cube, G.hctx); } return this._exp && this._exp.m; };
    this.onPress = () => { this._exp = null; };
    this.afterMove = () => this.tryAfter();
    this.noUndo = true; G.inputOn = true;
    this.showTry(true);
  },
  showTry(first) {
    const m = this.expected(); const h = this._exp;
    if (!m) return;
    if (!h) return;
    if (h.target.length) G.highlight = new Set(h.target);
    say((first ? 'Your turn! Tap the <b>glowing</b> button.<br>' : '') + `${h.say}<br>${moveLine(m)}`);
    refresh();
  },
  tryAfter() {
    this.moves++; this._exp = null;
    const st = this.def.stage;
    const unitDone = this.def.tryUnit === 'unit' && this.moves >= 2 && !G.hctx.plan && Hints.progress(st, G.cube) > this.p0;
    if (Hints.GOAL[st](G.cube) || unitDone || this.moves > 150) {
      G.inputOn = false; this.expected = null; Sfx.done(); setPose('cheer'); toast('Great!'); refresh();
      say(Hints.GOAL[st](G.cube) ? `You did it! ${this.def.done} Now try it <b>on your own</b>!` : 'You did it! Now try a whole one <b>on your own</b>, with no glowing buttons!');
      actions([{ label: 'On my own ▶', fn: () => this.own() }]); return;
    }
    Sfx.good(); this.showTry(false);
  },
  own() {
    this.setStep(3); actions([]);
    this.expected = null; this.noUndo = false; this.onPress = null;
    setCube(makeStageCase(this.def)); G.highlight = this.def.hl(G.cube);
    this.hints = 0; this.afterMove = () => this.ownAfter();
    this.hint = () => Hints.hint(G.cube, G.hctx);
    G.inputOn = true;
    say(`On your own! Finish <b>${this.def.title}</b>. Stuck? Tap <b>Hint</b>.`);
    refresh();
  },
  ownAfter() {
    if (!Hints.GOAL[this.def.stage](G.cube)) return;
    G.inputOn = false; Sfx.done(); setPose('cheer', 2500); G.highlight = null;
    say(`<b>Lesson complete!</b> ${this.def.done}`); refresh();
    setTimeout(() => { if (G.ctrl === this) lessonDone(this.num, this.hints); }, 1100);
  },
};

/* ---------- Lesson 0: Meet the Cube ---------- */
const Lesson0 = {
  start() { $('#playTitle').textContent = 'Lesson 0'; this.learn(); },
  setStep(i) { hud(dots(4, i)); },
  learn() {
    this.setStep(0); G.inputOn = false; this.expected = null; actions([]);
    setCube(E.newCube()); refresh();
    const c = G.cube;
    const pages = [
      ['This is a <b>Rubik\'s cube</b>! Every side has its own color. Let\'s learn how it works. <i>Drag the cube to look around!</i>', null],
      ['These are the <b>centers</b>. They <b>never move</b>! In this game yellow is always on top and white on the bottom.', q => q.st.length === 1],
      ['These are <b>edges</b>. Every edge has <b>2</b> colors.', q => q.st.length === 2],
      ['These are <b>corners</b>. Every corner has <b>3</b> colors.', q => q.st.length === 3],
      ['Each side has a letter: <b>U</b>p (top), <b>D</b>own (bottom), <b>F</b>ront, <b>B</b>ack, <b>L</b>eft and <b>R</b>ight.', null],
      ['A letter means turn that side <b>clockwise</b>. A little mark, like ' + PX("R'") + ', means turn it the <b>other way</b>. Just follow the arrows!', null],
    ];
    let i = 0;
    const page = () => {
      const [t, f] = pages[i]; say(t); G.highlight = f ? ids(c.cubies.filter(f)) : null; refresh();
      actions([{ label: i < pages.length - 1 ? 'Next ▶' : 'Watch me! ▶', fn: () => { if (++i < pages.length) page(); else this.watch(); } }]);
    };
    page();
  },
  async watch() {
    this.setStep(1); G.inputOn = false; actions([]); G.highlight = null;
    setCube(E.newCube()); refresh();
    const sid = G.session;
    const demo = [['R', 'Right side <b>UP</b>'], ["R'", 'and back <b>DOWN</b>'], ['U', 'Top to the <b>LEFT</b>'], ["U'", 'and back to the <b>RIGHT</b>'], ['F', 'Front turns <b>clockwise</b>, like a clock'], ["F'", 'and back the <b>other way</b>'], ['y', 'This one turns the <b>whole cube</b>! Use the round buttons'], ["y'", 'and back again']];
    for (const [n, t] of demo) {
      if (sid !== G.session) return;
      const m = mv(n); G.watchMove = m; say(`${PX(n)}&nbsp; ${t}`); refresh();
      await wait(1100); if (sid !== G.session) return;
      await playMove(m, 600); await wait(250);
    }
    G.watchMove = null; refresh(); setPose('cheer');
    say('See? Every turn can be <b>undone</b> by turning the other way.');
    actions([{ label: '↺ Again', alt: true, fn: () => this.watch() }, { label: 'Your turn ▶', fn: () => this.tryIt() }]);
  },
  tryIt() {
    this.setStep(2); actions([]); setCube(E.newCube());
    this.seq = E.parseAlg("R U R' U' y y'"); this.pos = 0;
    this.expected = () => this.seq[this.pos];
    this.afterMove = () => {
      this.pos++;
      if (this.pos >= this.seq.length) {
        G.inputOn = false; this.expected = null; Sfx.done(); setPose('cheer'); refresh();
        say('Great! By the way, ' + PX("R U R' U'") + ' is the <b>Marper Move</b>. You\'ll use it a lot!');
        actions([{ label: 'On my own ▶', fn: () => this.own() }]); return;
      }
      Sfx.good(); this.showNext();
    };
    this.noUndo = true; G.inputOn = true; this.showNext(true);
  },
  showNext(first) { const m = this.seq[this.pos]; say((first ? 'Your turn! Tap the <b>glowing</b> button.<br>' : '') + moveLine(m)); refresh(); },
  own() {
    this.setStep(3); actions([]); this.expected = null; this.noUndo = false;
    const faces = ['R', 'U', 'F', 'L'];
    const f1 = pick(faces); let f2; do { f2 = pick(faces); } while (f2 === f1);
    const mix = E.parseAlg(`${f1}${pick(['', "'"])} ${f2}${pick(['', "'"])}`);
    const c = E.newCube(); E.applyAlg(c, mix); setCube(c);
    this.hints = 0;
    this.hint = () => { const p = Hints.toSolved(G.cube, 4); return p ? { m: p[0], say: 'Undo my turns, last one first!' } : null; };
    this.afterMove = () => {
      if (!Checks.solved(G.cube)) return;
      G.inputOn = false; Sfx.done(); setPose('cheer', 2500); refresh();
      say('<b>Fixed!</b> You know how to turn the cube!');
      setTimeout(() => { if (G.ctrl === this) lessonDone(0, this.hints); }, 1100);
    };
    G.inputOn = true;
    say(`I mixed it up with ${PX(E.algStr(mix))}. Can you fix it? Undo my turns, <b>last one first</b>!`);
    refresh();
  },
};

/* ================= CHALLENGES (M2): drills + stage solves ================= */
function yTurns(c, n) { for (let i = 0; i < n; i++) E.applyAlg(c, 'y'); return c; }
function rnd(n) { return Math.floor(Math.random() * n); }
// a case that needs exactly one algorithm (plus lining up), on top of a solved base with a messy top
function algCase(base, invAlg, check) {
  for (let t = 0; t < 40; t++) {
    const c = messyTop(E.newCube(), 8);
    if (base) base(c);
    E.applyAlg(c, invAlg);
    for (let i = rnd(4); i > 0; i--) E.applyAlg(c, 'U');
    yTurns(c, rnd(4));
    if (!check(c)) return c;
  }
  return messyTop(E.newCube());
}
const DRILLS = [
  { key: 'd_marper', title: 'Marper Move', alg: "R U R' U'", desc: 'Put a white corner home',
    make: () => { const c = cornerCase(pick([1, 3, 5]), rnd(4)); return yTurns(c, rnd(4)); }, goal: c => Checks.firstLayer(c) },
  { key: 'd_slideR', title: 'Slide Right', alg: "U R U' R' U' F' U F", desc: 'Middle edge goes right',
    make: () => algCase(null, E.invertMoves(Hints.A.midR), Checks.twoLayers), goal: c => Checks.twoLayers(c) },
  { key: 'd_slideL', title: 'Slide Left', alg: "U' L' U L U F U' F'", desc: 'Middle edge goes left',
    make: () => algCase(null, E.invertMoves(Hints.A.midL), Checks.twoLayers), goal: c => Checks.twoLayers(c) },
  { key: 'yb', title: 'Yellow Builder', alg: "F R U R' U' F'", desc: 'Make the yellow cross',
    make: () => makeStageCase(LESSON_DEFS[5]), goal: c => Checks.yellowCross(c) },
  { key: 'd_swap', title: 'Swapper', alg: "R U R' U R U U R' U", desc: 'Match the yellow edges',
    make: () => makeStageCase(LESSON_DEFS[6]), goal: c => Checks.yellowEdges(c) },
  { key: 'd_shuffle', title: 'Corner Shuffle', alg: "U R U' L' U R' U' L", desc: 'Send the corners home',
    make: () => makeStageCase(LESSON_DEFS[7]), goal: c => Checks.cornersHome(c) },
  { key: 'd_twist', title: 'Twister', alg: "R' D' R D", desc: 'Twist the corners and finish!',
    make: () => makeStageCase(LESSON_DEFS[8]), goal: c => Checks.solved(c) },
];
const STAGE_SOLVES = LESSON_DEFS.slice(1).map((d, i) => ({ key: 's_' + d.stage, title: d.title, stage: d.stage, num: i + 1, def: d }));

// engine solution length (whole-cube turns don't count)
function parOf(c, goal) {
  const sim = E.cloneCube(c), ctx = { history: [], plan: null }; let n = 0, k = 0;
  while (!goal(sim) && k < 400) { const h = Hints.hint(sim, ctx); if (!h) break; E.applyMove(sim, h.m); Hints.track(ctx, h.m); k++; if (h.m.f !== 'y') n++; }
  return n;
}
const starsFor = (hints, moves, par) => hints ? 1 : moves <= par + Math.max(4, Math.round(par * 0.25)) ? 3 : 2;
function saveStars(key, s) { const all = Store.get('stars', {}); const nb = s > (all[key] || 0); all[key] = Math.max(all[key] || 0, s); Store.set('stars', all); return nb; }

function startDrill(i) { const C = Object.create(DrillRun); C.def = DRILLS[i]; C.idx = i; startPlay(C, 'challenges'); }
function startStageSolve(i) { const C = Object.create(StageRun); C.def = STAGE_SOLVES[i]; C.idx = i; startPlay(C, 'challenges'); }

const DrillRun = {
  start() {
    const d = this.def;
    $('#playTitle').textContent = d.title;
    this.n = 0; this.total = 5; this.moves = 0; this.par = 0; this.hints = 0;
    this.hint = () => Hints.hint(G.cube, G.hctx);
    say(`<b>${d.title}</b> drill! ${d.desc}, 5 times, from memory. Stuck? Tap <b>Hint</b>.`);
    actions([{ label: 'Show me the moves', alt: true, fn: () => { this.hints++; say(`<b>${d.title}</b>:<br>${PX(d.alg)}`); setPose('think', 1500); } }]);
    this.afterMove = m => { if (m && m.f !== 'y') this.moves++; this.check(); };
    this.next();
  },
  next() {
    const c = this.def.make(); setCube(c); G.highlight = null;
    this.par += parOf(c, this.def.goal); this.n++;
    hud(`<span class="pill px">${this.n}/${this.total}</span>`);
    G.inputOn = true; refresh();
  },
  check() {
    if (!this.def.goal(G.cube)) return;
    G.inputOn = false; G.highlight = null; Sfx.done(); setPose('cheer'); toast(this.n < this.total ? 'Nice!' : 'Done!'); refresh();
    setTimeout(() => {
      if (G.ctrl !== this) return;
      if (this.n < this.total) { say(pick(['Great!', 'Awesome!', 'You\'re getting fast!', 'Super!']) + ` Case ${this.n + 1} of ${this.total}…`); this.next(); }
      else this.finish();
    }, 1000);
  },
  finish() {
    const s = starsFor(this.hints, this.moves, this.par); const nb = saveStars(this.def.key, s);
    results({ title: s === 3 ? 'Perfect drill!' : 'Drill done!', stars: s,
      lines: [`Moves: ${this.moves} (target ${this.par})`, this.hints ? `Hints: ${this.hints}` : 'No hints!', nb ? '<b>New best stars!</b>' : ''],
      again: () => startDrill(this.idx), next: this.idx + 1 < DRILLS.length ? { label: 'Next drill', fn: () => startDrill(this.idx + 1) } : null });
  },
};

const StageRun = {
  showStage: true,
  start() {
    const d = this.def;
    $('#playTitle').textContent = d.title;
    this.moves = 0; this.hints = 0;
    this.hint = () => Hints.hint(G.cube, G.hctx);
    const c = makeStageCase(d.def); setCube(c); this.par = parOf(c, Hints.GOAL[d.stage]);
    hud(`<span class="pill px">${this.par}</span>`);
    say(`The cube is ready for <b>${d.title}</b>. Finish this stage! Try to beat <b>${this.par}</b> moves.`);
    actions([]);
    this.afterMove = m => { if (m && m.f !== 'y') this.moves++; hud(`<span class="pill px">${this.moves}/${this.par}</span>`); this.check(); };
    G.inputOn = true;
  },
  check() {
    if (!Hints.GOAL[this.def.stage](G.cube)) return;
    G.inputOn = false; G.highlight = null; Sfx.done(); setPose('cheer', 2000); toast('Stage done!'); refresh();
    const s = starsFor(this.hints, this.moves, this.par); const nb = saveStars(this.def.key, s);
    setTimeout(() => { if (G.ctrl === this) results({ title: 'Stage done!', stars: s,
      lines: [this.def.title, `Moves: ${this.moves} (target ${this.par})`, this.hints ? `Hints: ${this.hints}` : 'No hints!', nb ? '<b>New best stars!</b>' : ''],
      again: () => startStageSolve(this.idx), next: this.idx + 1 < STAGE_SOLVES.length ? { label: 'Next stage', fn: () => startStageSolve(this.idx + 1) } : null }); }, 1000);
  },
};

function renderChallenges() {
  const stars = Store.get('stars', {}); const best = Store.get('bestTime', null), bestH = Store.get('bestTimeHelp', null);
  const st = n => '★'.repeat(n) + '<span style="opacity:.25">' + '★'.repeat(3 - n) + '</span>';
  const keys = [...DRILLS, ...STAGE_SOLVES].map(d => d.key);
  const got = keys.reduce((s, k) => s + (stars[k] || 0), 0);
  const card = (id, num, title, desc, key) => `<button class="card" data-c="${id}"><div class="num${stars[key] ? ' done' : ''}">${num}</div><div><div class="big" style="font-size:26px">${title}</div><div class="desc">${desc}</div></div><div class="tag" style="color:#e0a800">${st(stars[key] || 0)}</div></button>`;
  $('#challengeList').innerHTML = `
    <div class="card" style="justify-content:center;font-size:26px;box-shadow:none;padding:10px">⭐ ${got} / ${keys.length * 3} stars</div>
    <div class="section-h">Algorithm drills</div>
    ${DRILLS.map((d, i) => card('d' + i, i + 1, d.title, `${PX(d.alg)}<br>${d.desc}`, d.key)).join('')}
    <div class="section-h">Stage solves</div>
    ${STAGE_SOLVES.map((d, i) => card('s' + i, d.num, d.title, 'Finish this stage in as few moves as you can', d.key)).join('')}
    <div class="section-h">Timed solves</div>
    <button class="card" id="cTimed"><div class="num">⏱</div><div><div class="big" style="font-size:26px">Timed Solve</div><div class="desc">${best || bestH ? `⭐ Solo: ${best ? fmtTime(best) : '—'} · 🤝 With help: ${bestH ? fmtTime(bestH) : '—'}` : 'Scramble and race the clock. Hints allowed!'}</div></div></button>
    <button class="card" id="cFree"><div class="num">∞</div><div><div class="big" style="font-size:26px">Free Play</div><div class="desc">Scramble, reset and twist freely</div></div></button>`;
  $('#challengeList').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { ac(); const id = b.dataset.c; (id[0] === 'd' ? startDrill : startStageSolve)(+id.slice(1)); });
  $('#cTimed').onclick = () => { ac(); startPlay(TimedSolve, 'challenges'); };
  $('#cFree').onclick = () => { ac(); startPlay(FreePlay, 'challenges'); };
}

/* ================= PAUSE + SETTINGS (M3) ================= */
CB.on = Store.get('cb', false);
const Settings = {
  mode: null,
  open(mode) {

  close() {
    $('#settings').classList.remove('on');

    this.mode = null;
  },
  render() {
    const sw = (id, on, label, sub) => `<div class="setrow"><div>${label}${sub ? `<small>${sub}</small>` : ''}</div><button class="switch${on ? ' on' : ''}" data-sw="${id}" aria-label="${label}"></button></div>`;

      ${sw('cb', CB.on, 'Color symbols', 'Shapes on the stickers')}
      <div class="cbkey">${['Y', 'G', 'B', 'O', 'R', 'W'].map(c => `<span><canvas width="44" height="44" data-k="${c}"></canvas>${{ Y: 'yellow', G: 'green', B: 'blue', O: 'orange', R: 'red', W: 'white' }[c]}</span>`).join('')}</div>
      <div class="row"></div>`;
    p.querySelectorAll('canvas[data-k]').forEach(cv => {
      const g = cv.getContext('2d'), c = cv.dataset.k;
      g.fillStyle = '#1b1730'; g.fillRect(0, 0, 44, 44); g.fillStyle = STICKER[c]; g.fillRect(4, 4, 36, 36);
      drawSymbol(c, (a, b) => [22 + a * 70, 22 - b * 70], g);
    });
    p.querySelector('.cbkey').style.display = CB.on ? '' : 'none';
    p.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => {
      ac(); const k = b.dataset.sw;

    const mk = (label, fn, alt) => { const b = document.createElement('button'); b.className = 'go' + (alt ? ' alt' : ''); b.textContent = label; b.onclick = () => { ac(); fn(); }; row.appendChild(b); };
    if (this.mode === 'pause') {
      mk('Quit', () => { this.close(); leavePlay(); show(G.backTo || 'menu'); }, true);
      mk('Resume ▶', () => this.close());
    } else mk('Done', () => this.close());
  },
};
$('#pauseBtn').addEventListener('click', () => { ac(); Settings.open('pause'); });
$('#setBtn').addEventListener('click', () => { ac(); Settings.open('settings'); });
// going to the background mid-game pauses it
document.addEventListener('visibilitychange', () => { if (document.hidden && $('#play').classList.contains('on') && !$('#overlay').classList.contains('on')) Settings.open('pause'); });
// the old Music.paint also updates the ♪ buttons; keep the switch in sync too


/* ================= TIMED SOLVE ================= */
const TimedSolve = {
  showStage: true,
  start() {
    $('#playTitle').textContent = 'Timed Solve';
    const c = E.newCube(); E.applyAlg(c, E.randomScramble(22)); setCube(c);
    this.t0 = 0; this.moves = 0; this.done = false; this.hints = 0;
    hud('<span class="pill px" id="timer">0.00</span>');
    say('All scrambled! The timer starts on your <b>first turn</b>. Stuck? Tap <b>Hint</b>. Good luck!');
    this.afterMove = m => { if (m && m.f !== 'y') this.moves++; this.check(); };
    this.onPress = () => { if (!this.t0) this.t0 = performance.now(); };
    this.hint = () => { if (!this.t0) this.t0 = performance.now(); if (!this.hints) hud('<span class="pill px" id="timer">0.00</span><span class="pill" style="font-size:15px;font-family:Jersey 10">🤝</span>'); return Hints.hint(G.cube, G.hctx); };
    actions([{ label: 'New scramble', alt: true, fn: () => startPlay(TimedSolve, 'challenges') }]);
    G.inputOn = true;
  },
  tick(now) { if (this.t0 && !this.done) { const el = document.getElementById('timer'); if (el) el.textContent = fmtTime(now - this.t0); } },
  check() {
    if (!E.Checks.solved(G.cube)) return;
    this.done = true; G.inputOn = false; G.highlight = null; refresh();
    const helped = this.hints > 0, key = helped ? 'bestTimeHelp' : 'bestTime';
    const t = performance.now() - this.t0; const best = Store.get(key, null);
    const nb = !best || t < best; if (nb) Store.set(key, t);
    Sfx.done(); setPose('cheer', 3000); say(helped ? '<b>SOLVED!</b> We did it together!' : '<b>SOLVED!</b> All by yourself!');
    setTimeout(() => results({
      title: nb ? 'New best!' : 'Solved!',
      lines: [helped ? `🤝 <b>Marper helped</b> (${this.hints} hint${this.hints > 1 ? 's' : ''})` : '⭐ <b>Solo solve!</b>', `Time: ${fmtTime(t)}`, `Moves: ${this.moves}`, best && !nb ? `Best ${helped ? 'with help' : 'solo'}: ${fmtTime(best)}` : ''],
      again: () => startPlay(TimedSolve, 'challenges') }), 1200);
  },
};

/* ================= FREE PLAY ================= */
const FreePlay = {
  showStage: true,
  start() {
    $('#playTitle').textContent = 'Free Play';
    setCube(E.newCube()); hud('');
    say('Twist away! Yellow on top, white on the bottom.');
    actions([
      { label: 'Scramble', fn: () => { const c = E.newCube(); E.applyAlg(c, E.randomScramble(22)); setCube(c); refresh(); say('Scrambled! Can you fix it?'); } },
      { label: 'Reset', alt: true, fn: () => { setCube(E.newCube()); refresh(); say('Good as new!'); } },
    ]);
    this.afterMove = () => { if (E.Checks.solved(G.cube) && G.history.length) { Sfx.done(); setPose('cheer', 1500); say('Solved! 🎉'); G.highlight = null; } };
    this.hint = () => Hints.hint(G.cube, G.hctx);
    G.inputOn = true;
  },
};

Music.init();
buildPad();
requestAnimationFrame(frame);
